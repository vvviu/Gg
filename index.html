.rcard{padding:32px 24px;text-align:center}.r-icon{font-size:3rem;margin-bottom:12px}.r-title{font-size:1.5rem;font-weight:800;margin-bottom:6px}.r-sub{font-size:.88rem;color:var(--muted);margin-bottom:22px}.r-score{font-family:"SF Mono","Courier New",monospace;font-size:3rem;font-weight:700;color:var(--blue);margin-bottom:6px}.r-detail{font-size:.8rem;color:var(--muted);margin-bottom:28px}.r-btns{display:flex;flex-direction:column;gap:10px}.btn-retry{padding:14px;border-radius:13px;background:rgba(255,69,58,.1);border:1px solid rgba(255,69,58,.28);color:#FF453A;font-family:-apple-system,sans-serif;font-weight:700;font-size:.95rem;cursor:pointer}.btn-retry:hover{background:rgba(255,69,58,.18)}.btn-home{padding:14px;border-radius:13px;background:rgba(10,132,255,.1);border:1px solid rgba(10,132,255,.28);color:var(--blue);font-family:-apple-system,sans-serif;font-weight:700;font-size:.95rem;cursor:pointer}.btn-home:hover{background:rgba(10,132,255,.18)}

<script>
'use strict';
let DB = {}, uploaded = {};
let curLec = '', curQs = [], idx = 0;
let wrongs = [], score = 0, done = {}, retryMode = false;
const trCache = {};
const $ = id => document.getElementById(id);

function showScr(n){ document.querySelectorAll('.scr').forEach(s=>s.classList.remove('on')); $(n).classList.add('on'); }
function toggleMode(){ document.body.dataset.theme = document.body.dataset.theme==='dark'?'light':'dark'; }
function setSt(type,msg){
  const bar=$('stbar'),sp=$('spin'),sm=$('stmsg');
  bar.className='st-bar on'+(type==='err'?' err':type==='ok'?' ok':'');
  sp.style.display=type==='load'?'block':'none';
  sm.textContent=msg;
}
function hideSt(){ $('stbar').classList.remove('on'); }

function onFile(inp,type){
  const f=inp.files[0]; if(!f) return;
  setSt('load',`⏳ جاري قراءة "${f.name}"...`);
  if(type==='txt') readTxt(f); else readPdf(f);
}
function readTxt(f){
  const r=new FileReader();
  r.onload=e=>parseAndLoad(e.target.result,f.name);
  r.onerror=()=>setSt('err','❌ فشل قراءة الملف');
  r.readAsText(f,'UTF-8');
}
function norm(s){ return (s||'').replace(/\u00a0/g,' ').replace(/[\t ]+/g,' ').trim(); }
function isAr(s){
  const a=(s.match(/[\u0600-\u06FF\u0750-\u077F\uFB50-\uFDFF\uFE70-\uFEFF]/g)||[]).length;
  const e=(s.match(/[A-Za-z0-9]/g)||[]).length;
  return a>0 && a>e;
}
function cleanOptText(raw){
  return norm(raw)
    .replace(/^[A-Ea-e]\s*[\.\-\)\:]\s*/,'')
    .replace(/[\u2713\u2714\u2611\u221A\u2705\uFE0F\*]/g,'')
    .replace(/\s{2,}/g,' ')
    .trim();
}
function isOpt(l){ return /^[A-Ea-e]\s*[\.\-\)\:]\s*\S/.test(norm(l)); }
function isQStart(l){
  const t=norm(l);
  return /^(Q\s*\d+|question\s*\d+)\s*[.:)\-]?\s*\S/i.test(t) ||
         /^\d+\s*[.)]\s*\S/.test(t);
}
function isAnsLine(l){ return /^(answer|correct answer|ans|correct)\s*[:\-]?\s*[A-Ea-e]/i.test(norm(l)); }
function hasCheckMark(l){ return /[\u2713\u2714\u2611\u221A\u2705\uFE0F]/.test(l) || /\*\s*$/.test(norm(l)); }
function getQText(l){
  return norm(l)
    .replace(/^(Q\s*\d+|question\s*\d+)\s*[.:)\-]?\s*/i,'')
    .replace(/^\d+\s*[.)]\s*/,'')
    .trim();
}
function getAnsChar(l){
  const m=norm(l).match(/(?:answer|correct answer|ans|correct)\s*[:\-]?\s*([A-Ea-e])/i);
  return m ? m[1].toLowerCase() : null;
}
function charToIdx(ch){ return {a:0,b:1,c:2,d:3,e:4}[String(ch||'').toLowerCase()] ?? -1; }

function extractAnswerKey(rawText){
  const key={};
  const lines=rawText.replace(/\r/g,'').split('\n');
  let inKey=false;
  for(const l of lines){
    const t=norm(l);
    if(/^(answer\s*key|answers|key)\s*:?\s*$/i.test(t)){ inKey=true; continue; }
    const m=t.match(/^(\d+)\s*[\.\)\:\-]\s*([A-Ea-e])\b/i);
    if(m){ key[parseInt(m[1])]=m[2].toLowerCase(); inKey=true; }
    else if(inKey && t.length>0 && !/^\d/.test(t)){
      if(Object.keys(key).length>3) break;
    }
  }
  return key;
}

function extractYellowTextFromPdfItems(items){
  const out=[];
  for(const it of items){
    const c=it.color;
    const yellow=(Array.isArray(c)&&c.length>=3&&((c[0]>0.8&&c[1]>0.8&&c[2]<0.3)||(c[0]>200&&c[1]>200&&c[2]<100)))||it.fill==='yellow'||it.fillColor==='yellow';
    if(yellow && it.str && it.str.trim()) out.push(it.str.trim());
  }
  return out.join(' ').trim();
}

async function readPdf(f){
  try{
    if(!window.pdfjsLib){
      const mod=await import('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.2.67/pdf.min.mjs');
      window.pdfjsLib=mod;
    }
    const lib=window.pdfjsLib;
    lib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.2.67/pdf.worker.min.mjs';
    const buf=await f.arrayBuffer();
    const pdf=await lib.getDocument({data:buf}).promise;

    let txt='';
    let highlighted='';

    for(let i=1;i<=pdf.numPages;i++){
      const pg=await pdf.getPage(i);
      const ct=await pg.getTextContent({includeMarkedContent:false});
      const pageItems=[];
      for(const it of ct.items){
        if(!it.str || !it.str.trim()) continue;
        pageItems.push({
          x:Math.round(it.transform[4]),
          y:Math.round(it.transform[5]),
          str:it.str,
          font:it.fontName||'',
          color:it.color||null,
          fill:it.fill||null,
          fillColor:it.fillColor||null
        });
      }

      const rows=new Map();
      for(const it of pageItems){
        if(!rows.has(it.y)) rows.set(it.y,[]);
        rows.get(it.y).push(it);
      }

      const ys=[...rows.keys()].sort((a,b)=>b-a);
      let pageTxt='';
      for(const y of ys){
        const items=rows.get(y);
        const enItems=items.filter(it=>!isAr(it.str)).sort((a,b)=>a.x-b.x);
        const en=enItems.map(it=>it.str).join(' ').trim();
        if(en) pageTxt += en + '\n';
      }

      txt += pageTxt + '\n';
      highlighted += ' ' + extractYellowTextFromPdfItems(pageItems);
    }

    if((txt.trim().length<30) && highlighted.trim().length===0){
      setSt('err','⚠️ PDF لا يحتوي نصاً قابلاً للاستخراج — جرب TXT أو PDF نصي');
      return;
    }

    const raw=(txt + '\n' + highlighted).trim();
    parseAndLoad(raw, f.name);
  }catch(e){
    console.error(e);
    setSt('err','❌ فشل قراءة PDF');
  }
}

function parse(raw){
  const answerKey=extractAnswerKey(raw);
  const hasGlobalKey=Object.keys(answerKey).length>0;

  const lines=raw.replace(/\r\n/g,'\n').replace(/\r/g,'\n').split('\n').map(l=>norm(l)).filter(l=>l.length>0);
  const questions=[];
  let qLines=[], opts=[], ansIdx=-1, inOpts=false, qNum=0, optCheckIdx=-1;

  function flush(){
    const qText=qLines.join(' ').trim();
    const cleanOpts=opts.filter(o=>o&&o.length>=1);
    if(!qText || cleanOpts.length<2){
      qLines=[]; opts=[]; ansIdx=-1; inOpts=false; optCheckIdx=-1;
      return;
    }
    let finalAns=ansIdx;
    if(hasGlobalKey && answerKey[qNum]!==undefined){
      const ki=charToIdx(answerKey[qNum]);
      if(ki>=0 && ki<cleanOpts.length) finalAns=ki;
    }
    if(optCheckIdx>=0 && optCheckIdx<cleanOpts.length) finalAns=optCheckIdx;
    finalAns=Math.max(-1,Math.min(finalAns,cleanOpts.length-1));
    questions.push({q:qText, opts:cleanOpts, ans:finalAns, optsTrArr:null});
    qLines=[]; opts=[]; ansIdx=-1; inOpts=false; optCheckIdx=-1;
  }

  for(const l of lines){
    if(isQStart(l)){
      flush();
      const qt=getQText(l);
      const nm=l.trim().match(/^(?:Q\s*|question\s*)?(\d+)/i);
      qNum=nm?parseInt(nm[1]):qNum+1;
      const inlineAns=l.match(/(?:answer|correct)\s*[:\-]?\s*([A-Ea-e])\s*$/i);
      if(inlineAns){
        ansIdx=charToIdx(inlineAns[1]);
        if(qt) qLines.push(qt.replace(/(?:answer|correct)\s*[:\-]?\s*[A-Ea-e]\s*$/i,'').trim());
      }else{
        if(qt) qLines.push(qt);
      }
      inOpts=false;
      continue;
    }
    if(isOpt(l) && qLines.length>0){
      inOpts=true;
      if(hasCheckMark(l)) optCheckIdx=opts.length;
      opts.push(cleanOptText(l));
      continue;
    }
    if(isAnsLine(l)){
      const ch=getAnsChar(l);
      if(ch) ansIdx=charToIdx(ch);
      continue;
    }
    if(inOpts && /^[A-Ea-e]$/.test(l)){
      ansIdx=charToIdx(l);
      continue;
    }
    if(isAr(l)) continue;
    if(qLines.length>0 && !inOpts && l.length>3) qLines.push(l);
  }

  flush();
  return questions;
}

function parseAndLoad(text,fname){
  const all=parse(text);
  if(all.length===0){
    setSt('err','❌ لم يُعثر على أسئلة — تنسيق Q1 / A / B / C / Answer: X');
    return;
  }
  const name=fname.replace(/\.[^/.]+$/,'').trim() || 'ملف مرفوع';
  uploaded={};
  uploaded[name]=all;
  setSt('ok',`✅ تم تحميل ${all.length} سؤال من "${name}"`);
  setTimeout(hideSt,4000);
  boot();
}

function boot(){
  DB={};
  Object.entries(uploaded).forEach(([n,qs])=>{ DB[n]=qs; });
  buildHome();
}

function buildHome(){
  const list=$('llist'), lbl=$('sec-lbl'), emp=$('empty');
  list.innerHTML='';
  const entries=Object.entries(DB);
  if(!entries.length){
    lbl.style.display='none';
    emp.style.display='block';
    return;
  }
  lbl.style.display='block';
  emp.style.display='none';
  entries.forEach(([name,qs],i)=>{
    const d=document.createElement('div');
    d.className='lcard glass';
    d.innerHTML=`<div class="lnum">L${String(i+1).padStart(2,'0')}</div><div class="lbody"><div class="lname">${name}</div><div class="lcnt">${qs.length} سؤال</div></div><div class="larr">←</div>`;
    d.onclick=()=>startLec(name);
    list.appendChild(d);
  });
}

function startLec(name,qs=null){
  curLec=name;
  retryMode=!!qs;
  curQs=qs||[...DB[name]];
  idx=0;
  wrongs=[];
  score=0;
  done={};
  showScr('s-quiz');
  renderQ();
}

function renderQ(){
  const d=curQs[idx], total=curQs.length;
  $('plec').textContent=curLec;
  $('pnum').textContent=`${idx+1} / ${total}`;
  $('pfill').style.width=`${((idx+1)/total)*100}%`;
  $('qtxt').textContent=d.q;
  const trQ=$('tr-q');
  if(trQ){ trQ.style.display='none'; trQ.textContent=''; }
  $('btn-tr-q').classList.remove('active');
  $('btn-tr-a').classList.remove('active');
  $('bnext').style.display='none';
  document.querySelectorAll('.otxt-ar').forEach(el=>{ el.style.display='none'; el.textContent=''; });
  $('bprev').disabled=idx===0;
  $('bskip').style.display=idx===total-1?'none':'block';

  const wrap=$('opts');
  wrap.innerHTML='';
  d.opts.forEach((o,i)=>{
    const el=document.createElement('div');
    el.className='opt';
    el.innerHTML=`<div class="olbl">${String.fromCharCode(65+i)}</div><div class="opt-body"><div class="otxt">${o}</div><div class="otxt-ar" data-i="${i}"></div></div>`;
    el.onclick=()=>answer(i,d.ans);
    wrap.appendChild(el);
  });

  if(done[idx]!==undefined) restoreAns(done[idx],d.ans);
  prefetchTr(idx);
  if(idx+1 < curQs.length) prefetchTr(idx+1);
}

async function prefetchTr(i){
  const d=curQs[i];
  if(!d) return;
  const qKey='q:'+d.q;
  if(!trCache[qKey]) googleTr(d.q,'en','ar').then(tr=>{ trCache[qKey]=tr; });
  if(!d.optsTrArr){
    Promise.all(d.opts.map(o=>googleTr(o,'en','ar'))).then(arr=>{ d.optsTrArr=arr; });
  }
}

function answer(chosen,correct){
  if(done[idx]!==undefined) return;
  if(correct<0){
    done[idx]=chosen;
    const all=document.querySelectorAll('.opt');
    if(all[chosen]) all[chosen].style.borderColor='rgba(255,255,255,.4)';
    all.forEach(o=>o.style.pointerEvents='none');
    $('bnext').style.display='block';
    $('bskip').style.display='none';
    return;
  }
  done[idx]=chosen;
  const all=document.querySelectorAll('.opt');
  if(chosen===correct){
    all[chosen].classList.add('correct');
    score++;
  }else{
    all[chosen].classList.add('wrong');
    if(all[correct]) all[correct].classList.add('correct');
    wrongs.push(curQs[idx]);
  }
  all.forEach(o=>o.style.pointerEvents='none');
  $('bnext').style.display='block';
  $('bskip').style.display='none';
}

function restoreAns(chosen,correct){
  const all=document.querySelectorAll('.opt');
  all.forEach(o=>o.style.pointerEvents='none');
  if(correct<0){
    if(all[chosen]) all[chosen].style.borderColor='rgba(255,255,255,.4)';
  }else if(chosen===correct){
    if(all[chosen]) all[chosen].classList.add('correct');
  }else{
    if(all[chosen]) all[chosen].classList.add('wrong');
    if(all[correct]) all[correct].classList.add('correct');
  }
  $('bnext').style.display='block';
  $('bskip').style.display='none';
}

function prevQ(){ if(idx>0){ idx--; renderQ(); } }
function skipQ(){ if(idx<curQs.length-1){ idx++; renderQ(); } }
function nextQ(){ idx++; if(idx<curQs.length) renderQ(); else showResult(); }

function showResult(){
  const total=curQs.length, pct=Math.round(score/total*100);
  $('rsub').textContent=curLec+(retryMode?' · إعادة الأخطاء':'');
  $('rscore').textContent=`${score}/${total}`;
  $('rdetail').textContent=`${pct}% نسبة النجاح`;
  $('rico').textContent=pct>=80?'🏆':pct>=60?'👍':'📚';
  $('rtitle').textContent=pct>=80?'ممتاز!':pct>=60?'جيد':'راجع المادة';
  $('bretry').style.display=wrongs.length?'block':'none';
  showScr('s-result');
}

function retryWrong(){ startLec(curLec+' (إعادة الأخطاء)',[...wrongs]); }
function goHome(){ showScr('s-home'); }

async function doTr(type){
  const d=curQs[idx];
  if(type==='q'){
    const box=$('tr-q'), btn=$('btn-tr-q');
    if(box.style.display==='block'){ box.style.display='none'; btn.classList.remove('active'); return; }
    box.style.display='block';
    btn.classList.add('active');
    const k='q:'+d.q;
    if(trCache[k]){ box.textContent=trCache[k]; return; }
    box.textContent='⏳ جاري الترجمة...';
    const savedIdx=idx;
    const tr=await googleTr(d.q,'en','ar');
    trCache[k]=tr;
    if(idx===savedIdx){ box.textContent=tr; }
  }else{
    const wrap=$('opts'), btn=$('btn-tr-a');
    const firstEl=wrap.querySelector('.otxt-ar');
    const isShown=firstEl && firstEl.style.display==='block';
    if(isShown){
      wrap.querySelectorAll('.otxt-ar').forEach(s=>{ s.style.display='none'; });
      btn.classList.remove('active');
      return;
    }
    btn.classList.add('active');
    if(d.optsTrArr && d.optsTrArr.length===d.opts.length){ showOptTr(d.optsTrArr); return; }
    wrap.querySelectorAll('.otxt-ar').forEach(s=>{ s.textContent='⏳'; s.style.display='block'; });
    const savedIdx=idx;
    const trArr=[];
    for(const o of d.opts){ const tr=await googleTr(o,'en','ar'); trArr.push(tr); }
    d.optsTrArr=trArr;
    if(idx===savedIdx){ showOptTr(trArr); }
    else{ wrap.querySelectorAll('.otxt-ar').forEach(s=>{ s.style.display='none'; }); btn.classList.remove('active'); }
  }
}

function showOptTr(arr){
  const wrap=$('opts');
  arr.forEach((tr,i)=>{
    const el=wrap.querySelector(`.otxt-ar[data-i="${i}"]`);
    if(el){ el.textContent=tr; el.style.display='block'; }
  });
}

async function googleTr(text,sl='en',tl='ar'){
  if(!text || !text.trim()) return text;
  const t=text.trim().slice(0,500);
  const cacheKey=`${sl}:${tl}:${t}`;
  if(trCache[cacheKey]) return trCache[cacheKey];
  try{
    const url=`https://translate.googleapis.com/translate_a/single?client=gtx&sl=${sl}&tl=${tl}&dt=t&q=${encodeURIComponent(t)}`;
    const r=await fetch(url,{signal:AbortSignal.timeout(8000)});
    if(r.ok){
      const data=await r.json();
      const tr=(data[0]||[]).map(x=>x&&x[0]?x[0]:'').join('').trim();
      if(tr && tr.length>0 && tr!==t){ trCache[cacheKey]=tr; return tr; }
    }
  }catch(_){}
  try{
    const url=`https://api.mymemory.translated.net/get?q=${encodeURIComponent(t.slice(0,400))}&langpair=${sl}|${tl}`;
    const r=await fetch(url,{signal:AbortSignal.timeout(8000)});
    if(r.ok){
      const data=await r.json();
      const tr=(data.responseData?.translatedText||'').trim();
      if(tr && tr!==t && !tr.toUpperCase().startsWith('MYMEMORY')){ trCache[cacheKey]=tr; return tr; }
    }
  }catch(_){}
  return t;
}
